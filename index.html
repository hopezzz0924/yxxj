<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>幼小衔接乐园</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;color:#2D3436;background:#FFF8F0;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input{font:inherit;color:inherit}
.page{display:none;min-height:100vh;padding-bottom:80px}
.page.active{display:block}
.container{padding:0 12px}

.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-size:15px;font-weight:600;padding:12px 32px;border:none;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn-primary{background:linear-gradient(135deg,#FF6B6B,#FF8E8E);color:#fff;box-shadow:0 4px 16px rgba(255,107,107,.35)}
.btn-outline{background:transparent;border:2px solid #FF6B6B;color:#FF6B6B}
.btn-accent{background:linear-gradient(135deg,#FFE66D,#FFF3A0);color:#2D3436}
.btn-lg{padding:20px 48px;font-size:18px}
.btn-sm{padding:8px 20px;font-size:13px}
.btn:disabled{opacity:.5;pointer-events:none}

.card{background:#fff;border-radius:20px;box-shadow:0 2px 12px rgba(0,0,0,.08);padding:24px;margin:12px 4px}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.flex-center{display:flex;align-items:center;justify-content:center}

.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #EEE;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0;font-size:12px;color:#999;border:none;background:none;cursor:pointer}
.tabbar button.active{color:#FF6B6B}
.tabbar .tab-icon{font-size:24px;margin-bottom:2px}

.topbar{background:#FF6B6B;color:#fff;padding:14px 12px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:12px}
.topbar button{font-size:24px;cursor:pointer;background:none;border:none;color:#fff}

.hero{background:linear-gradient(135deg,#FF6B6B,#FF8E8E,#FFA07A);padding:32px 16px;border-radius:0 0 32px 32px;margin-bottom:16px;color:#fff}
.hero .title{font-size:26px;font-weight:800;display:block}
.hero .subtitle{font-size:13px;opacity:.9;display:block;margin-top:4px}
.star-count{font-size:28px;font-weight:800;color:#F39C12}

.subject-card{background:#fff;border-radius:20px;padding:24px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.08);border:3px solid #EEE;cursor:pointer}
.subject-card:active{transform:scale(.97)}
.subject-card .mascot{font-size:52px;text-align:center;margin-bottom:10px}
.subject-card .name{font-size:20px;font-weight:700;text-align:center}
.subject-card .desc{font-size:13px;color:#636E72;text-align:center;margin-top:4px}
.subject-card .bar{height:12px;background:#F0F0F0;border-radius:999px;overflow:hidden;margin:12px 0 6px}
.subject-card .bar-fill{height:100%;border-radius:999px;transition:width .5s}
.subject-card .bar-text{font-size:12px;color:#636E72;text-align:right;display:block}
.subject-card .enter{display:flex;align-items:center;justify-content:center;padding:14px;border-radius:999px;color:#fff;font-size:15px;font-weight:600;margin-top:12px}

.unit-item{display:flex;align-items:center;background:#fff;border-radius:20px;padding:16px 14px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,.08);cursor:pointer}
.unit-item:active{transform:scale(.97)}
.unit-num{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff;margin-right:14px;flex-shrink:0}
.unit-info{flex:1}
.unit-title{font-size:16px;font-weight:700}
.unit-sub{font-size:12px;color:#636E72}
.unit-stars{font-size:16px;margin-top:4px}

.lesson-tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0;-webkit-overflow-scrolling:touch}
.lesson-tabs button{flex-shrink:0;padding:10px 20px;background:#fff;border-radius:999px;font-size:13px;color:#636E72;border:none;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;white-space:nowrap}
.lesson-tabs button.active{background:#FF6B6B;color:#fff;font-weight:600}

.ex-bar{height:8px;background:#F0F0F0;border-radius:999px;overflow:hidden;margin:10px 0}
.ex-bar-fill{height:100%;background:linear-gradient(to right,#FF6B6B,#4ECDC4);border-radius:999px;transition:width .3s}
.ex-label{display:flex;justify-content:space-between;font-size:13px;color:#636E72;margin-bottom:12px}

.option-card{display:flex;align-items:center;background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);border:3px solid transparent;cursor:pointer}
.option-card:active{transform:scale(.97)}
.option-label{width:40px;height:40px;border-radius:50%;background:#F0F0F0;display:flex;align-items:center;justify-content:center;font-weight:700;margin-right:14px;flex-shrink:0}
.option-text{flex:1}
.option-card.selected{border-color:#FF6B6B;background:#FFF0F0}
.option-card.selected .option-label{background:#FF6B6B;color:#fff}
.option-card.correct{border-color:#2ECC71;background:#F0FFF4}
.option-card.correct .option-label{background:#2ECC71;color:#fff}
.option-card.wrong{border-color:#E74C3C;background:#FFF0F0}
.option-card.wrong .option-label{background:#E74C3C;color:#fff}

.spell-area{display:flex;gap:10px;margin-top:12px}
.spell-input{flex:1;padding:12px 16px;font-size:18px;border:3px solid #E0E0E0;border-radius:12px;outline:none}
.spell-input:focus{border-color:#FF6B6B}
.spell-input:disabled{background:#F5F5F5}
.spell-result{text-align:center;margin-top:14px;font-size:18px;font-weight:700;padding:10px;border-radius:12px}

.ex-dots{display:flex;justify-content:center;gap:8px;padding:14px}
.ex-dot{width:12px;height:12px;border-radius:50%;background:#E0E0E0;transition:all .3s}
.ex-dot.current{background:#FF6B6B;transform:scale(1.3)}
.ex-dot.done{background:#2ECC71}
.ex-dot.wrong{background:#E74C3C}

.result-hero{text-align:center;padding:40px 20px}
.result-emoji{font-size:72px;display:block;margin-bottom:10px}
.result-msg{font-size:20px;font-weight:700;display:block;margin-bottom:16px}
.result-score{font-size:48px;font-weight:800;color:#FF6B6B}
.result-stars{font-size:40px;margin:8px 0}
.result-grade{text-align:left}
.result-grade .row{display:flex;justify-content:space-between;padding:8px 0;font-size:15px;color:#636E72}
.result-grade .val{font-weight:600;color:#2D3436}
.result-actions{display:flex;flex-direction:column;gap:10px;padding:0 4px;margin-top:12px}

.reward-hero{background:linear-gradient(135deg,#FFE66D,#FFD93D);border-radius:20px;padding:28px;text-align:center;margin:12px 4px}
.reward-hero .big{font-size:52px;font-weight:900;color:#7B6800}
.reward-hero .label{font-size:16px;color:#8B7A20;font-weight:600}

.shop-scroll{display:flex;overflow-x:auto;gap:12px;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.shop-item{flex-shrink:0;width:180px;background:#fff;border-radius:16px;padding:18px 14px;box-shadow:0 2px 12px rgba(0,0,0,.08);border:3px solid #EEE;text-align:center;cursor:pointer}
.shop-item:active{transform:scale(.95)}
.shop-icon{font-size:40px;display:block;margin-bottom:6px}
.shop-name{font-size:13px;font-weight:700;display:block;margin-bottom:4px}
.shop-desc{font-size:11px;color:#636E72;display:block;margin-bottom:10px}
.shop-price{color:#fff;font-size:13px;font-weight:800;padding:5px 14px;border-radius:999px;display:inline-block}

.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.badge-card{background:#fff;border-radius:14px;padding:16px 10px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.badge-card.earned{border:2px solid #FFE66D;background:linear-gradient(180deg,#FFFEF0,#FFF9D0)}
.badge-card.locked{opacity:.4}
.badge-icon{font-size:36px;display:block;margin-bottom:4px}
.badge-name{font-size:13px;font-weight:700}
.badge-desc{font-size:11px;color:#636E72}

.section-title{font-size:20px;font-weight:700;margin:22px 0 10px;padding:0 4px}
.section-subtitle{font-size:13px;color:#636E72;margin:0 0 14px}

.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:12px 28px;border-radius:999px;font-size:13px;z-index:2000;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

.modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;border-radius:20px;padding:28px;width:100%;max-width:340px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.modal-actions{display:flex;gap:12px;justify-content:center;margin-top:20px}

@keyframes pop-in{0%{transform:scale(0)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pop-in{animation:pop-in .4s ease}
</style>
</head>
<body>

<!-- Home -->
<div id="page-home" class="page active">
  <div class="hero">
    <div>
      <span class="title">幼小衔接乐园</span>
      <span class="subtitle">快乐学习，轻松上小学！</span>
    </div>
    <span style="font-size:56px">🚀</span>
  </div>
  <div class="container">
    <div class="card flex-between" onclick="switchTab('reward')">
      <div class="flex-center"><span style="font-size:24px;margin-right:6px">⭐</span><span class="star-count" id="totalStars">0</span><span style="margin-left:4px;color:#636E72">颗星星</span></div>
      <span style="font-size:13px;color:#FF6B6B">查看奖励 →</span>
    </div>
    <div class="section-title">选一科开始学习吧！</div>
    <div id="subjectsList"></div>
  </div>
</div>

<!-- Subject -->
<div id="page-subject" class="page">
  <div class="topbar"><button onclick="goHome()">←</button><span id="subjTitle"></span></div>
  <div class="container"><div id="unitList"></div></div>
</div>

<!-- Lesson -->
<div id="page-lesson" class="page">
  <div class="topbar"><button onclick="goSubject()">←</button><span id="lessonTitle"></span></div>
  <div class="container">
    <div class="lesson-tabs" id="lessonTabs"></div>
    <div id="lessonCard"></div>
    <div style="padding:20px 0 40px;text-align:center"><button class="btn btn-primary btn-lg" id="startBtn">开始练习</button></div>
  </div>
</div>

<!-- Exercise -->
<div id="page-exercise" class="page">
  <div class="topbar"><button onclick="goLesson()">←</button><span id="exTitle"></span></div>
  <div class="container">
    <div class="ex-bar"><div class="ex-bar-fill" id="exBar" style="width:0%"></div></div>
    <div class="ex-label"><span id="exLabel"></span><span id="exStatus"></span></div>
    <div class="card"><div id="exQuestion"></div></div>
    <div style="display:flex;justify-content:center;gap:16px;margin-top:12px">
      <button class="btn btn-outline" id="exPrev" onclick="exPrev()">上一题</button>
      <button class="btn btn-primary" id="exNext" onclick="exNext()">下一题</button>
    </div>
    <div class="ex-dots" id="exDots"></div>
  </div>
</div>

<!-- Result -->
<div id="page-result" class="page">
  <div class="topbar"><button onclick="goHome()">←</button><span>练习结果</span></div>
  <div class="container"><div id="resultContent"></div></div>
</div>

<!-- Reward -->
<div id="page-reward" class="page">
  <div class="topbar"><button onclick="goHome()">←</button><span>奖励中心</span></div>
  <div class="container"><div id="rewardContent"></div></div>
</div>

<!-- TabBar -->
<div class="tabbar" id="tabbar">
  <button class="active" onclick="switchTab('home')"><span class="tab-icon">🏠</span>首页</button>
  <button onclick="switchTab('reward')"><span class="tab-icon">⭐</span>奖励</button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal -->
<div class="modal-mask" id="modalMask" style="display:none"><div class="modal-box" id="modalBox"></div></div>

// ====== Helpers ======
function LS_get(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function LS_set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function getProgress(){return LS_get('progress',{chinese:{},math:{},english:{}});}
function saveProgress(p){LS_set('progress',p);}
function getStars(){return LS_get('stars',0);}
function addStars(n){var s=getStars()+n;LS_set('stars',s);return s;}
function spendStars(n){var s=getStars();if(s<n)return -1;var r=s-n;LS_set('stars',r);return r;}
function getBadges(){return LS_get('badges',[]);}
function addBadge(b){var badges=getBadges();if(!badges.find(function(x){return x.id===b.id;})){badges.push(b);LS_set('badges',badges);}}
function getExchangeHistory(){return LS_get('exchanges',[]);}
function addExchangeRecord(r){var h=getExchangeHistory();h.push(r);LS_set('exchanges',h);}

var _toastTimer;
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(_toastTimer);_toastTimer=setTimeout(function(){t.classList.remove('show');},1800);}
function vibrate(p){if(navigator.vibrate)navigator.vibrate(p);}
function showModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modalMask').style.display='flex';}
function hideModal(){document.getElementById('modalMask').style.display='none';}
document.getElementById('modalMask').addEventListener('click',function(e){if(e.target===this)hideModal();});

function showPage(id){
  var pages=document.querySelectorAll('.page');

// ====== Exercise ======
function generateMathQ(){
  var qs=[];
  for(var i=0;i<50;i++){
    var t=Math.floor(Math.random()*3),a,b,ans,q;
    if(t===0){a=Math.floor(Math.random()*80)+10;b=Math.floor(Math.random()*(100-a-1))+1;q=a+'+'+b;ans=a+b;}
    else if(t===1){a=Math.floor(Math.random()*75)+25;b=Math.floor(Math.random()*a);q=a+'-'+b;ans=a-b;}
    else{a=Math.floor(Math.random()*9)+1;b=Math.floor(Math.random()*9)+1;q=a+'×'+b;ans=a*b;}
    var opts=[ans];
    while(opts.length<4){var d=ans+Math.floor(Math.random()*19)-9;if(d>=0&&d<=100&&opts.indexOf(d)===-1)opts.push(d);}
    opts.sort(function(){return Math.random()-0.5;});
    qs.push({q:q+'=?',opts:opts.map(String),ans:opts.indexOf(ans)});
  }
  return qs;
}
function generateEngQ(dayIdx,type){
  var words=ENG_WORDS[dayIdx]||[],exs=[],n=Math.min(words.length,12);
  var sample=words.slice();sample.sort(function(){return Math.random()-0.5;});sample=sample.slice(0,n);
  for(var i=0;i<sample.length;i++){
    var w=sample[i];
    if(type==='spell'){exs.push({type:'spell',q:w.cn+' 的英文是什么？',ans:w.en});}
    else{
      var opts=[w.cn],pool=ENG_WORDS[dayIdx];
      while(opts.length<4){var r=pool[Math.floor(Math.random()*pool.length)].cn;if(opts.indexOf(r)===-1)opts.push(r);}
      opts.sort(function(){return Math.random()-0.5;});
      exs.push({q:w.en+' 是什么意思？',opts:opts,ans:opts.indexOf(w.cn)});
    }
  }
  return exs;
}

  else if(lesson.type==='eng-choice')STATE.exercises=generateEngQ(ui,'choice');
  else if(lesson.type==='eng-spell')STATE.exercises=generateEngQ(ui,'spell');
  else STATE.exercises=lesson.exercises||[];

}

function renderExercise(){

  document.getElementById('exLabel').textContent=(i+1)+'/'+total;

  if(ex.type==='spell'){
    document.getElementById('exQuestion').innerHTML='<div style="display:inline-block;background:#FF6B6B;color:#fff;font-size:13px;font-weight:700;padding:4px 14px;border-radius:999px;margin-bottom:12px">✏️ Q'+(i+1)+'</div><div style="font-size:20px;font-weight:600;margin-bottom:12px">'+ex.q+'</div><div class="spell-area"><input type="text" class="spell-input" id="spellInput" placeholder="输入英文单词..." autocomplete="off" autocapitalize="off" '+(STATE.answered?'disabled':'')+'><button class="btn btn-primary btn-sm" onclick="submitSpell()" '+(STATE.answered?'disabled':'')+'>确认</button></div>'+(STATE.answered?'<div class="spell-result" style="'+(STATE.spellCorrect?'background:#F0FFF4;color:#2ECC71':'background:#FFF0F0;color:#E74C3C')+'">'+(STATE.spellCorrect?'✅ 正确！':'❌ 正确答案：'+ans)+'</div>':'');
    setTimeout(function(){var inp=document.getElementById('spellInput');if(inp&&!STATE.answered){inp.focus();inp.onkeydown=function(e){if(e.key==='Enter')submitSpell();};}},100);
  }else{
    var qhtml='<div style="display:inline-block;background:#FF6B6B;color:#fff;font-size:13px;font-weight:700;padding:4px 14px;border-radius:999px;margin-bottom:12px">Q'+(i+1)+'</div><div style="font-size:20px;font-weight:600;margin-bottom:16px">'+ex.q+'</div>';
    var opts=ex.opts||[];
    for(var oi=0;oi<opts.length;oi++){
      var status='';
      if(STATE.answered){if(oi===ans)status='correct';else if(oi===STATE.selectedIdx&&oi!==ans)status='wrong';}
      else if(oi===STATE.selectedIdx)status='selected';
      qhtml+='<div class="option-card '+status+'" onclick="selectAns('+oi+')"><div class="option-label">'+'ABCD'[oi]+'</div><div class="option-text">'+opts[oi]+'</div>'+(status==='correct'?'<span>✅</span>':'')+(status==='wrong'?'<span>❌</span>':'')+'</div>';
    }
    document.getElementById('exQuestion').innerHTML=qhtml;
  }
  var st=document.getElementById('exStatus');
  if(ex.type!=='spell'&&STATE.answered){
    st.innerHTML=STATE.selectedIdx===ans?'<span style="color:#2ECC71;font-weight:600">✅ 正确！</span>':'<span style="color:#E74C3C;font-weight:600">❌ 再想想</span>';
  }else if(ex.type==='spell'){st.innerHTML='';}else{st.innerHTML='';}

  document.getElementById('exPrev').disabled=(i===0);

  var dots='';

    var cls='ex-dot';if(di===i)cls+=' current';
    var ua=STATE.userAnswers[di];

    dots+='<div class="'+cls+'"></div>';

function selectAns(idx){

  setTimeout(function(){
    var ex=STATE.exercises[STATE.currentExIndex],ans=ex.ans!==undefined?ex.ans:ex.answer;
    STATE.userAnswers[STATE.currentExIndex]=idx;STATE.answered=true;

  },300);

function submitSpell(){
  if(STATE.answered)return;var inp=document.getElementById('spellInput');if(!inp)return;
  var val=inp.value.trim();if(!val){showToast('请输入英文单词');return;}
  var ex=STATE.exercises[STATE.currentExIndex],correctAns=(ex.ans||'').toLowerCase().trim();
  var correct=(val.toLowerCase().trim()===correctAns);
  STATE.userAnswers[STATE.currentExIndex]=correct?1:0;STATE.spellCorrect=correct;STATE.answered=true;
  vibrate(correct?100:[200,100,200]);renderExercise();
}

function exPrev(){
  if(STATE.currentExIndex<=0)return;STATE.currentExIndex--;
  var a=STATE.userAnswers[STATE.currentExIndex];STATE.answered=(typeof a==='number'&&a>=0);STATE.selectedIdx=STATE.answered?a:-1;STATE.spellCorrect=(a===1);
  renderExercise();
}
function exNext(){
  if(!STATE.answered)return;
  if(STATE.currentExIndex>=STATE.exercises.length-1){finishExercise();return;}
  STATE.currentExIndex++;var a=STATE.userAnswers[STATE.currentExIndex];
  STATE.answered=(typeof a==='number'&&a>=0);STATE.selectedIdx=STATE.answered?a:-1;STATE.spellCorrect=(a===1);
  renderExercise();
}

function finishExercise(){
  vibrate(300);
  var exs=STATE.exercises,answers=STATE.userAnswers,subj=STATE.currentSubject;
  var correct=0,total=exs.length;
  for(var i=0;i<total;i++){
    var ex=exs[i],a=answers[i];
    if(ex.type==='spell'){if(a===1)correct++;}
    else{if(a===ex.ans||a===ex.answer)correct++;}
  }
  var accuracy=Math.round(correct/total*100);
  var stars=(correct===total)?((subj==='math')?5:(subj==='english')?6:1):0;

  // Save progress
  var course=getCourseData(subj),unit=course.units[STATE.currentUnitIndex];
  var p=getProgress();if(!p[subj])p[subj]={};
  var existing=p[subj][unit.id]||{};
  p[subj][unit.id]={completed:correct===total,stars:stars,bestStars:Math.max(existing.bestStars||0,stars),bestScore:Math.max(existing.bestScore||0,accuracy)};
  saveProgress(p);
  if(stars>0)addStars(stars);

  // Badges
  var totalStars=getStars(),badges=getBadges(),newBadges=[];
  [{id:'s10',name:'初露锋芒',icon:'⭐',desc:'累计10颗星',cond:totalStars>=10},
   {id:'s30',name:'学习小达人',icon:'🌟',desc:'累计30颗星',cond:totalStars>=30},
   {id:'s60',name:'智慧之星',icon:'💫',desc:'累计60颗星',cond:totalStars>=60},
   {id:'s100',name:'学霸大王',icon:'👑',desc:'累计100颗星',cond:totalStars>=100}].forEach(function(m){
    if(m.cond&&!badges.find(function(b){return b.id===m.id;})){addBadge(m);newBadges.push(m);}
  });
  if(stars>=5&&!badges.find(function(b){return b.id==='perfect';})){var fb={id:'perfect',name:'满分冠军',icon:'🎯',desc:'第一次全部答对'};addBadge(fb);newBadges.push(fb);}

  showPage('page-result');
  var msg=(stars>=1)?'太棒了！全对通过！':'别灰心，再来一次！';
  var emoji=(stars>=1)?'🎉':'💪';
  var html='<div class="result-hero card"><span class="result-emoji pop-in">'+emoji+'</span><span class="result-msg">'+msg+'</span><div class="result-score">'+correct+'/'+total+'</div><div style="color:#636E72;margin:4px 0">正确率：'+accuracy+'%</div><div class="result-stars">'+(stars>=1?'⭐ × '+stars:'☆')+'</div></div>';
  html+='<div class="result-grade card"><div style="font-weight:700;margin-bottom:8px">成绩单</div>';
  html+='<div class="row"><span>科目</span><span class="val" style="color:'+course.color+'">'+course.name+'</span></div>';
  html+='<div class="row"><span>单元</span><span class="val">'+unit.title+'</span></div>';
  html+='<div class="row"><span>正确</span><span class="val">'+correct+'/'+total+'</span></div>';
  html+='<div class="row"><span>获得星星</span><span class="val">⭐ × '+stars+'</span></div></div>';
  if(newBadges.length>0){html+='<div class="card" style="background:#FFF9E6;text-align:center">🎊 获得新徽章！ '+newBadges.map(function(b){return b.name;}).join(' ')+'</div>';}
  html+='<div class="result-actions"><button class="btn btn-outline" onclick="retryEx()">再来一次</button><button class="btn btn-outline" onclick="goLesson()">返回学习</button><button class="btn btn-primary" onclick="goHome()">返回首页</button></div>';
  document.getElementById('resultContent').innerHTML=html;
}
function retryEx(){STATE.currentExIndex=0;STATE.userAnswers=[];for(var i=0;i<STATE.exercises.length;i++)STATE.userAnswers.push(-1);STATE.answered=false;STATE.selectedIdx=-1;STATE.spellCorrect=false;showPage('page-exercise');renderExercise();}

// ====== Reward ======
function renderReward(){
  var stars=getStars(),badges=getBadges(),progress=getProgress();
  var allBadges=[
    {id:'s10',name:'初露锋芒',icon:'⭐',desc:'累计10颗星'},{id:'s30',name:'学习小达人',icon:'🌟',desc:'累计30颗星'},
    {id:'s60',name:'智慧之星',icon:'💫',desc:'累计60颗星'},{id:'s100',name:'学霸大王',icon:'👑',desc:'累计100颗星'},
    {id:'perfect',name:'满分冠军',icon:'🎯',desc:'第一次全部答对'}
  ];
  // Badges HTML
  var bhtml='<div class="section-title">🏅 徽章 ('+badges.length+'/'+allBadges.length+')</div><div class="badge-grid">';
  for(var i=0;i<allBadges.length;i++){
    var bg=allBadges[i],earned=!!badges.find(function(b){return b.id===bg.id;});
    bhtml+='<div class="badge-card '+(earned?'earned':'locked')+'"><div class="badge-icon">'+(earned?bg.icon:'🔒')+'</div><div class="badge-name">'+bg.name+'</div><div class="badge-desc">'+bg.desc+'</div></div>';
  }
  bhtml+='</div>';

  // Shop
  var items=STATE.shopItems;
  var pokemonHtml='',gameHtml='';
  for(var i=0;i<items.length;i++){
    var it=items[i],card='<div class="shop-item" style="background:'+it.bg+';border-color:'+it.color+'" onclick="openExchange(\''+it.id+'\')"><span class="shop-icon">'+it.icon+'</span><span class="shop-name">'+it.name+'</span><span class="shop-desc">'+it.desc+'</span><span class="shop-price" style="background:'+it.color+'">⭐ '+it.cost+'</span><div style="font-size:11px;color:#636E72;margin-top:4px">'+it.tag+'</div></div>';
    if(it.cat==='pokemon')pokemonHtml+=card;else gameHtml+=card;
  }

  // Exchange history
  var history=getExchangeHistory().slice(-10).reverse(),hhtml='';
  if(history.length>0){
    hhtml='<div class="section-title">📋 兑换记录</div>';
    for(var i=0;i<history.length;i++){hhtml+='<div class="card flex-between"><span>'+history[i].icon+' '+history[i].name+'</span><span style="color:#E74C3C;font-weight:700">-'+history[i].cost+' ⭐</span></div>';}
  }

  var footerMsg=stars>=300?'🎮 可以兑换Switch游戏啦！':stars>=100?'🎴 可以兑换宝可梦卡包啦！':stars>=10?'📚 继续加油！':'🚀 快来学习获取星星吧！';

  document.getElementById('rewardContent').innerHTML=
    '<div class="reward-hero"><div style="font-size:48px">⭐</div><div class="big">'+stars+'</div><div class="label">颗星星</div></div>'+
    '<div class="section-title">🎮 兑换商城</div><div class="section-subtitle">努力学习攒星星！</div>'+
    '<div style="font-weight:700;margin:0 4px 8px">🎴 宝可梦卡包 <span style="font-size:12px;color:#636E72;background:#F5F5F5;padding:2px 10px;border-radius:999px">100⭐/包(&lt;50元)</span></div>'+
    '<div class="shop-scroll">'+pokemonHtml+'</div>'+
    '<div style="font-weight:700;margin:16px 4px 8px">🎮 Switch游戏 <span style="font-size:12px;color:#636E72;background:#F5F5F5;padding:2px 10px;border-radius:999px">300⭐/款(&lt;200元)</span></div>'+
    '<div class="shop-scroll">'+gameHtml+'</div>'+
    hhtml+bhtml+'<div style="text-align:center;padding:20px;font-weight:600">'+footerMsg+'</div>';
}

function openExchange(id){
  var item=STATE.shopItems.find(function(s){return s.id===id;});
  if(!item)return;var stars=getStars();
  if(stars<item.cost){showToast('星星不足！还需要 '+(item.cost-stars)+' 颗⭐');return;}
  showModal('<div style="font-size:52px">'+item.icon+'</div><div style="font-size:18px;font-weight:700;margin:8px 0">确认兑换？</div><div style="color:#FF6B6B;font-weight:600;margin-bottom:12px">'+item.name+'</div><div style="background:#F8F8F8;border-radius:12px;padding:14px;margin-bottom:12px;font-size:15px">消耗：<b style="color:#E74C3C">⭐ '+item.cost+'</b><br>当前：<b style="color:#F39C12">⭐ '+stars+'</b><br>剩余：<b style="color:#2ECC71">⭐ '+(stars-item.cost)+'</b></div><div style="font-size:12px;color:#636E72;margin-bottom:14px">💡 兑换后请找爸爸妈妈要实物奖励哦</div><div class="modal-actions"><button class="btn btn-outline btn-sm" onclick="hideModal()">再想想</button><button class="btn btn-primary btn-sm" onclick="confirmExchange(\''+item.id+'\')">确认兑换！</button></div>');
}

function confirmExchange(id){
  var item=STATE.shopItems.find(function(s){return s.id===id;});
  if(!item)return;var remaining=spendStars(item.cost);
  if(remaining<0){showToast('星星不足！');return;}
  addExchangeRecord({id:item.id,name:item.name,icon:item.icon,cost:item.cost});
  vibrate(400);hideModal();
  showModal('<div style="font-size:52px">🎉</div><div style="font-size:18px;font-weight:700;margin:8px 0">兑换成功！</div><div style="margin-bottom:6px">恭喜获得</div><div style="color:#FF6B6B;font-weight:600;margin-bottom:10px">'+item.name+'</div><div style="color:#636E72;margin-bottom:4px">消费 '+item.cost+' ⭐ · 剩余 '+remaining+' ⭐</div><button class="btn btn-primary btn-sm" onclick="hideModal();renderReward();renderHome()">太棒了！</button>');
}

// ====== Init ======
renderHome();
</script>
</body>
</html>
