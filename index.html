<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="幼小衔接乐园">
<link rel="manifest" href="data:application/json,{%22name%22:%22%E5%B9%BC%E5%B0%8F%E8%A1%94%E6%8E%A5%E4%B9%90%E5%9B%AD%22,%22short_name%22:%22%E5%B9%BC%E5%B0%8F%E8%A1%94%E6%8E%A5%22,%22start_url%22:%22./%22,%22display%22:%22standalone%22,%22orientation%22:%22portrait%22,%22background_color%22:%22%23FFF8F0%22,%22theme_color%22:%22%23FF6B6B%22}">
<title>幼小衔接乐园</title>
<style>
/* ============ CSS Reset & Variables ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#FF6B6B;--primary-light:#FF8E8E;--secondary:#4ECDC4;--secondary-light:#7EDDD6;
  --accent:#FFE66D;--accent-light:#FFF3A0;--chinese:#FF6B6B;--math:#4ECDC4;--english:#A78BFA;
  --bg:#FFF8F0;--bg-card:#FFF;--text:#2D3436;--text-light:#636E72;--text-white:#FFF;
  --shadow:0 2px 12px rgba(0,0,0,.08);--shadow-lg:0 6px 24px rgba(0,0,0,.12);
  --radius:12px;--radius-lg:20px;--radius-round:999px;--font-xl:22px;--font-lg:18px;--font-md:15px;--font-sm:13px;--font-xs:11px;
}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:var(--font-md);color:var(--text);background:var(--bg);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
input,button,textarea{font:inherit;color:inherit}

/* ============ Common ============ */
.page{display:none;min-height:100vh;padding-bottom:80px}
.page.active{display:block}
.container{padding:0 16px}
.section-title{font-size:var(--font-xl);font-weight:700;margin:24px 0 12px;padding:0 4px}
.section-subtitle{font-size:var(--font-sm);color:var(--text-light);margin:0 0 16px;padding:0 4px}
.card{background:var(--bg-card);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:24px;margin:16px 4px}
.flex-center{display:flex;align-items:center;justify-content:center}
.flex-between{display:flex;align-items:center;justify-content:space-between}

.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-round);font-size:var(--font-md);font-weight:600;padding:12px 32px;border:none;cursor:pointer;transition:transform .15s,opacity .15s;text-decoration:none}
.btn:active{transform:scale(.95);opacity:.85}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:var(--text-white);box-shadow:0 4px 16px rgba(255,107,107,.35)}
.btn-secondary{background:linear-gradient(135deg,var(--secondary),var(--secondary-light));color:var(--text-white)}
.btn-accent{background:linear-gradient(135deg,var(--accent),#FFF3A0);color:var(--text)}
.btn-outline{background:transparent;border:2px solid var(--primary);color:var(--primary)}
.btn-lg{padding:20px 48px;font-size:var(--font-lg)}
.btn-sm{padding:8px 20px;font-size:var(--font-sm)}
.btn:disabled{opacity:.5;pointer-events:none}

/* ============ Animations ============ */
@keyframes pop-in{0%{transform:scale(0);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes slide-up{0%{transform:translateY(40px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}33%{transform:translateY(-8px) rotate(2deg)}66%{transform:translateY(4px) rotate(-2deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pop-in{animation:pop-in .4s cubic-bezier(.68,-.55,.27,1.55)}.slide-up{animation:slide-up .4s ease}.float{animation:float 3s ease-in-out infinite}

/* ============ TabBar ============ */
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#FFF;border-top:1px solid #EEE;padding-bottom:env(safe-area-inset-bottom);z-index:50}
.tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0;font-size:12px;color:#999;cursor:pointer;border:none;background:none}
.tabbar .tab.active{color:var(--primary)}
.tabbar .tab-icon{font-size:24px;margin-bottom:2px}

/* ============ Toast ============ */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:12px 28px;border-radius:var(--radius-round);font-size:var(--font-sm);z-index:2000;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}

/* ============ Modal ============ */
.modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-box{background:#fff;border-radius:var(--radius-lg);padding:32px;width:100%;max-width:360px;text-align:center;box-shadow:var(--shadow-lg)}
.modal-actions{display:flex;gap:16px;justify-content:center;margin-top:24px}
.modal-actions .btn{flex:1;max-width:150px}

/* ============ TopBar ============ */
.topbar{background:var(--primary);color:#fff;padding:16px 16px;font-size:var(--font-lg);font-weight:700;display:flex;align-items:center;gap:12px}
.topbar .back-btn{font-size:24px;cursor:pointer;background:none;border:none;color:#fff;padding:4px 8px}

/* ============ Home Page ============ */
.hero{background:linear-gradient(135deg,#FF6B6B,#FF8E8E,#FFA07A);padding:32px 20px;display:flex;align-items:center;justify-content:space-between;border-radius:0 0 32px 32px;margin-bottom:20px;color:#fff}
.hero-title{font-size:26px;font-weight:800;display:block;margin-bottom:6px}
.hero-subtitle{font-size:var(--font-sm);opacity:.9}
.hero-mascot{font-size:64px;animation:float 3s ease-in-out infinite}
.star-summary{margin:0 4px 16px}
.star-count-num{font-size:28px;font-weight:800;color:#F39C12}
.subject-card{background:#fff;border-radius:var(--radius-lg);padding:24px;margin-bottom:16px;box-shadow:var(--shadow);border:3px solid #EEE;cursor:pointer;transition:transform .15s}
.subject-card:active{transform:scale(.97)}
.subject-mascot{font-size:56px;text-align:center;margin-bottom:12px}
.subject-info{text-align:center;margin-bottom:16px}
.subject-name{font-size:var(--font-xl);font-weight:700}
.subject-desc{font-size:var(--font-sm);color:var(--text-light);margin-top:4px}
.progress-bar{height:12px;background:#F0F0F0;border-radius:var(--radius-round);overflow:hidden;margin-bottom:6px}
.progress-fill{height:100%;border-radius:var(--radius-round);transition:width .5s}
.progress-text{font-size:var(--font-xs);text-align:right;display:block}
.subject-btn{display:flex;align-items:center;justify-content:center;padding:14px;border-radius:var(--radius-round);color:#fff;font-size:var(--font-md);font-weight:600;margin-top:12px}

/* ============ Subject Page ============ */
.subject-header{padding:32px 20px;display:flex;align-items:center;justify-content:space-between;border-radius:0 0 32px 32px;margin-bottom:20px;color:#fff}
.subject-header .header-icon{font-size:40px}
.subject-header .header-title{font-size:28px;font-weight:800}
.subject-header .header-progress{font-size:var(--font-sm);opacity:.9}
.unit-item{display:flex;align-items:center;background:#fff;border-radius:var(--radius-lg);padding:20px 16px;margin-bottom:14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.unit-item:active{transform:scale(.97)}
.unit-item.locked{opacity:.5}
.unit-item.completed{border-left:5px solid #2ECC71}
.unit-number{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;margin-right:16px;flex-shrink:0}
.unit-info{flex:1}
.unit-title{font-size:var(--font-md);font-weight:700}
.unit-subtitle{font-size:var(--font-xs);color:var(--text-light)}
.unit-stars{font-size:20px;margin-top:4px}
.unit-arrow{font-size:22px;margin-left:8px;opacity:.5}

/* ============ Lesson Page ============ */
.lesson-tabs{display:flex;gap:10px;overflow-x:auto;padding:12px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.lesson-tabs::-webkit-scrollbar{display:none}
.lesson-tab{flex-shrink:0;padding:10px 22px;background:#fff;border-radius:var(--radius-round);font-size:var(--font-sm);color:var(--text-light);box-shadow:var(--shadow);cursor:pointer;border:none;white-space:nowrap}
.lesson-tab.active{background:var(--primary);color:#fff;font-weight:600}
.knowledge-card{background:#fff;border-radius:var(--radius-lg);padding:28px 20px;margin:16px 4px;box-shadow:var(--shadow-lg);min-height:400px}
.card-title-row{display:flex;align-items:center;gap:10px;margin-bottom:24px;padding-bottom:16px;border-bottom:2px dashed #F0F0F0}
.card-emoji{font-size:40px}
.card-title{font-size:var(--font-xl);font-weight:700}
.card-content{font-size:var(--font-md);line-height:2;white-space:pre-line}
.card-nav{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:16px}
.card-indicator{font-size:var(--font-sm);color:var(--text-light)}

/* ============ Exercise Page ============ */
.ex-progress{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ex-progress .bar{flex:1;height:8px;background:#F0F0F0;border-radius:var(--radius-round);overflow:hidden}
.ex-progress .bar-fill{height:100%;background:linear-gradient(to right,var(--primary),var(--secondary));border-radius:var(--radius-round);transition:width .3s}
.ex-progress-text{font-size:var(--font-sm);color:var(--text-light);white-space:nowrap}
.question-number{display:inline-block;background:var(--primary);color:#fff;font-size:var(--font-sm);font-weight:700;padding:6px 16px;border-radius:var(--radius-round);margin-bottom:16px}
.question-text{font-size:var(--font-lg);font-weight:600;line-height:1.6;margin-bottom:24px}
.option-card{display:flex;align-items:center;background:#fff;border-radius:var(--radius);padding:16px 20px;margin-bottom:12px;box-shadow:var(--shadow);border:3px solid transparent;cursor:pointer;transition:all .15s}
.option-card:active{transform:scale(.97)}
.option-label{width:44px;height:44px;border-radius:50%;background:#F0F0F0;display:flex;align-items:center;justify-content:center;font-weight:700;margin-right:16px;flex-shrink:0}
.option-text{flex:1}
.option-icon{font-size:24px;margin-left:8px}
.option-card.selected{border-color:var(--primary);background:#FFF0F0}
.option-card.selected .option-label{background:var(--primary);color:#fff}
.option-card.correct{border-color:#2ECC71;background:#F0FFF4}
.option-card.correct .option-label{background:#2ECC71;color:#fff}
.option-card.wrong{border-color:#E74C3C;background:#FFF0F0}
.option-card.wrong .option-label{background:#E74C3C;color:#fff}
.ex-dots{display:flex;justify-content:center;gap:10px;padding:16px}
.ex-dot{width:14px;height:14px;border-radius:50%;background:#E0E0E0;transition:all .3s}
.ex-dot.current{background:var(--primary);transform:scale(1.3);box-shadow:0 0 8px rgba(255,107,107,.4)}
.ex-dot.correct{background:#2ECC71}
.ex-dot.wrong{background:#E74C3C}
.status-txt{font-size:var(--font-sm);font-weight:600;min-height:20px}
.status-correct{color:#2ECC71}
.status-wrong{color:#E74C3C}
.spell-area{display:flex;gap:12px;margin-top:16px}
.spell-input{flex:1;padding:14px 18px;font-size:var(--font-lg);border:3px solid #E0E0E0;border-radius:var(--radius);outline:none;transition:border-color .2s}
.spell-input:focus{border-color:var(--primary)}
.spell-input:disabled{background:#F5F5F5}
.spell-result{text-align:center;margin-top:16px;font-size:var(--font-lg);font-weight:700;padding:12px;border-radius:var(--radius)}
.spell-result.status-correct{background:#F0FFF4;color:#2ECC71}
.spell-result.status-wrong{background:#FFF0F0;color:#E74C3C}

/* ============ Result Page ============ */
.result-card{text-align:center;padding:40px 24px}
.result-emoji{font-size:80px;display:block;margin-bottom:12px}
.result-message{font-size:var(--font-lg);font-weight:700;display:block;margin-bottom:20px}
.result-score{display:flex;align-items:baseline;justify-content:center;gap:4px;margin-bottom:12px}
.result-score .num{font-size:52px;font-weight:800;color:var(--primary)}
.result-score .divider{font-size:28px;color:var(--text-light)}
.result-score .total{font-size:28px;color:var(--text-light);margin-right:8px}
.result-accuracy{font-size:var(--font-md);color:var(--text-light);margin-bottom:16px}
.result-stars{font-size:48px;margin-bottom:8px;letter-spacing:4px}
.result-grade{margin-top:16px}
.result-grade .row{display:flex;justify-content:space-between;padding:10px 0;font-size:var(--font-md);color:var(--text-light)}
.result-grade .row .val{font-weight:600;color:var(--text)}

/* ============ Reward Page ============ */
.reward-hero2{background:linear-gradient(135deg,#FFE66D,#FFD93D,#FFC107);border-radius:var(--radius-lg);padding:32px;text-align:center;margin:16px 4px;box-shadow:0 6px 24px rgba(255,217,61,.3)}
.reward-hero2 .star-icon{font-size:60px;display:block;margin-bottom:8px}
.reward-hero2 .star-count{font-size:56px;font-weight:900;color:#7B6800}
.reward-hero2 .star-label{font-size:var(--font-lg);color:#8B7A20;font-weight:600}
.shop-cat-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:700}
.shop-cat-cost{font-size:var(--font-xs);color:var(--text-light);background:#F5F5F5;padding:4px 14px;border-radius:var(--radius-round)}
.shop-scroll{display:flex;overflow-x:auto;gap:14px;padding:4px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.shop-scroll::-webkit-scrollbar{display:none}
.shop-card2{flex-shrink:0;width:200px;background:#fff;border-radius:var(--radius-lg);padding:22px 16px;box-shadow:var(--shadow);border:3px solid #EEE;text-align:center;cursor:pointer;transition:transform .15s}
.shop-card2:active{transform:scale(.95)}
.shop-icon{font-size:44px;display:block;margin-bottom:8px}
.shop-name{font-size:var(--font-sm);font-weight:700;margin-bottom:4px;display:block}
.shop-desc{font-size:var(--font-xs);color:var(--text-light);margin-bottom:12px}
.shop-bottom{display:flex;justify-content:center;align-items:center;gap:8px}
.shop-price{color:#fff;font-size:var(--font-sm);font-weight:800;padding:6px 16px;border-radius:var(--radius-round)}
.shop-tag{font-size:var(--font-xs);color:var(--text-light)}
.history-item{display:flex;align-items:center;gap:10px;padding:12px 18px;background:#fff;border-radius:var(--radius);margin-bottom:8px;box-shadow:var(--shadow)}
.history-icon{font-size:24px}.history-name{flex:1;font-size:var(--font-sm)}.history-cost{font-size:var(--font-sm);font-weight:700;color:#E74C3C}
.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.badge-card{background:#fff;border-radius:var(--radius);padding:18px 12px;text-align:center;box-shadow:var(--shadow)}
.badge-card.earned{border:2px solid var(--accent);background:linear-gradient(180deg,#FFFEF0,#FFF9D0)}
.badge-card.locked{opacity:.5}
.badge-icon{font-size:40px;display:block;margin-bottom:4px}
.badge-name{font-size:var(--font-sm);font-weight:700}
.badge-desc{font-size:var(--font-xs);color:var(--text-light)}
.badge-status{font-size:var(--font-xs);color:var(--secondary)}
.stat-card{background:#fff;border-radius:var(--radius);padding:20px;margin-bottom:12px;box-shadow:var(--shadow)}
.stat-bar{height:12px;background:#F0F0F0;border-radius:var(--radius-round);overflow:hidden;margin:8px 0}
.stat-fill{height:100%;border-radius:var(--radius-round);transition:width .5s}
</style>
</head>
<body>

<!-- ====== Pages ====== -->

<!-- Home -->
<div id="page-home" class="page active">
  <div class="hero">
    <div>
      <span class="hero-title">幼小衔接乐园 🎒</span>
      <span class="hero-subtitle">快乐学习，轻松上小学！</span>
    </div>
    <div class="hero-mascot">🚀</div>
  </div>
  <div class="container">
    <div class="card star-summary flex-between" onclick="switchTab('reward')">
      <div class="flex-center"><span style="font-size:28px;margin-right:8px">⭐</span><span class="star-count-num" id="totalStars">0</span><span style="margin-left:4px;color:var(--text-light)">颗星星</span></div>
      <span style="font-size:var(--font-sm);color:var(--primary)">查看奖励 →</span>
    </div>
    <div class="section-title">选一科开始学习吧！</div>
    <div id="subjectsList"></div>
  </div>
</div>

<!-- Subject -->
<div id="page-subject" class="page">
  <div class="topbar"><button class="back-btn" onclick="goHome()">←</button><span id="subjTitle">语文学习</span></div>
  <div class="container"><div id="unitList"></div></div>
</div>

<!-- Lesson -->
<div id="page-lesson" class="page">
  <div class="topbar"><button class="back-btn" onclick="goSubject()">←</button><span id="lessonTitle"></span></div>
  <div class="container">
    <div class="lesson-tabs" id="lessonTabs"></div>
    <div id="lessonCard"></div>
    <div style="padding:20px 0 40px;text-align:center"><button class="btn btn-primary btn-lg" id="startExerciseBtn">📝 开始练习</button></div>
  </div>
</div>

<!-- Exercise -->
<div id="page-exercise" class="page">
  <div class="topbar"><button class="back-btn" onclick="goLesson()">←</button><span id="exTitle">练习</span></div>
  <div class="container">
    <div class="ex-progress"><div class="bar"><div class="bar-fill" id="exBar" style="width:0%"></div></div><span class="ex-progress-text" id="exLabel">0/0</span></div>
    <div class="status-txt" id="exStatus"></div>
    <div class="card"><div id="exQuestion"></div></div>
    <div style="display:flex;justify-content:center;gap:20px;margin-top:16px">
      <button class="btn btn-outline" id="exPrev" onclick="exPrev()">◀ 上一题</button>
      <button class="btn btn-primary" id="exNext" onclick="exNext()" disabled>下一题 ▶</button>
    </div>
    <div class="ex-dots" id="exDots"></div>
  </div>
</div>

<!-- Result -->
<div id="page-result" class="page">
  <div class="topbar"><button class="back-btn" onclick="goHome()">←</button><span>练习结果</span></div>
  <div class="container"><div id="resultContent"></div></div>
</div>

<!-- Reward -->
<div id="page-reward" class="page">
  <div class="topbar"><button class="back-btn" onclick="goHome()">←</button><span>⭐ 奖励中心</span></div>
  <div class="container"><div id="rewardContent"></div></div>
</div>

<!-- TabBar -->
<div class="tabbar" id="tabbar">
  <button class="tab active" onclick="switchTab('home')"><span class="tab-icon">🏠</span>首页</button>
  <button class="tab" onclick="switchTab('reward')"><span class="tab-icon">⭐</span>奖励</button>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal -->
<div class="modal-mask" id="modalMask" style="display:none"><div class="modal-box" id="modalBox"></div></div>

<script>
/* ================================================================
   DATA - 课程数据
   ================================================================ */
const COURSES = {
  chinese: { id:'chinese',name:'语文',icon:'📖',color:'#FF6B6B',desc:'学拼音 · 认汉字 · 会阅读', units:[
    { id:'chinese-u1',title:'拼音认读',subtitle:'认识单韵母和声调',icon:'🔤',lessons:[
      { id:'chinese-u1-l1',title:'认识 a o e',type:'pinyin',cards:[
        { title:'单韵母 a',content:'张大嘴巴 a a a\n像个小姑娘在唱歌\n\n写法：先写半圆，再写竖弯',emoji:'🍎',pinyin:'a'},
        { title:'单韵母 o',content:'圆圆嘴巴 o o o\n像只大公鸡喔喔叫\n\n写法：从左到右画个圆',emoji:'🐓',pinyin:'o'},
        { title:'单韵母 e',content:'扁扁嘴巴 e e e\n像只大白鹅在水里\n\n写法：从里往外画半圆，加一横',emoji:'🦢',pinyin:'e'}],
       exercises:[{q:'下面哪个字母读作"a"？',opts:['o','a','e','i'],ans:1},{q:'"大白鹅"代表哪个字母？',opts:['a','o','e','u'],ans:2},{q:'圆圆嘴巴读什么？',opts:['a','o','e','ü'],ans:1},{q:'哪个字母像小姑娘张大嘴巴？',opts:['e','o','a','i'],ans:2}]},
      { id:'chinese-u1-l2',title:'认识 i u ü',type:'pinyin',cards:[

const LS = {
  get(k, def){ try{ const v=localStorage.getItem(k); return v!==null&&v!==undefined?JSON.parse(v):def; }catch(e){ return def; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
};

function getProgress(){ return LS.get('progress',{chinese:{},math:{},english:{}}); }
function saveProgress(p){ return LS.set('progress',p); }
function getTotalStars(){ return LS.get('stars',0); }
function addStars(n){ const s=getTotalStars()+n; LS.set('stars',s); return s; }
function spendStars(n){ const s=getTotalStars(); if(s<n) return -1; const r=s-n; LS.set('stars',r); return r; }
function getBadges(){ return LS.get('badges',[]); }
function addBadge(b){ const badges=getBadges(); if(!badges.find(x=>x.id===b.id)){ badges.push({...b,earnedAt:Date.now()}); LS.set('badges',badges); return true; } return false; }
function getExchangeHistory(){ return LS.get('exchanges',[]); }
function addExchangeRecord(r){ const h=getExchangeHistory(); h.push({...r,exchangedAt:Date.now()}); LS.set('exchanges',h); return h; }

function calculateStars(correct,total,subject){ if(correct!==total) return 0; return subject==='math'?5:subject==='english'?6:1; }
function isUnitUnlocked(units,uIndex,progress){
  if(uIndex===0) return true;
  const prev=units[uIndex-1]; const pp=progress[prev.id];
  return !!(pp&&pp.completed);
}
function getSubjCompletion(units,progress){
  if(!units||!units.length) return 0;
  let c=0; units.forEach(u=>{ if(progress[u.id]&&progress[u.id].completed) c++; });
  return Math.round((c/units.length)*100);
}

function generateMathQuestions(){
  const qs=[], N=50;
  const shuffled=[]; for(let i=0;i<N;i++){ const r=Math.floor(Math.random()*3); shuffled.push(r); }
  const adjust=shuffled.filter(x=>x===0).length-shuffled.filter(x=>x===1).length;
  let addCount=shuffled.filter(x=>x===0).length, subCount=shuffled.filter(x=>x===1).length, mulCount=shuffled.filter(x=>x===2).length;
  const targetEach=Math.floor(N/3);
  while(addCount>targetEach+3){ const idx=shuffled.indexOf(0); shuffled[idx]=Math.random()<0.5?1:2; addCount--; }
  while(subCount>targetEach+3){ const idx=shuffled.indexOf(1); shuffled[idx]=Math.random()<0.5?0:2; subCount--; }
  while(mulCount>targetEach+3){ const idx=shuffled.indexOf(2); shuffled[idx]=Math.random()<0.5?0:1; mulCount--; }
  for(let i=0;i<N;i++){
    const type=shuffled[i];
    let q,ans;
    if(type===0){ // addition within 100
      const a=Math.floor(Math.random()*90)+5; const b=Math.floor(Math.random()*(100-a-1))+1;
      q=a+'+'+b+'=?'; ans=a+b;
    } else if(type===1){ // subtraction within 100
      const a=Math.floor(Math.random()*85)+15; const b=Math.floor(Math.random()*(a-1))+1;
      q=a+'-'+b+'=?'; ans=a-b;
    } else { // multiplication 1-9
      const a=Math.floor(Math.random()*9)+1; const b=Math.floor(Math.random()*9)+1;
      q=a+'×'+b+'=?'; ans=a*b;
    }
    const opts=new Set([ans]); while(opts.size<4){ const d=ans+Math.floor(Math.random()*21)-10; if(d>=0&&d<=100) opts.add(d); }
    const optArr=[...opts].sort(()=>Math.random()-0.5);
    qs.push({q,opts:optArr.map(String),ans:optArr.indexOf(ans)});
  }
  return qs;
}

function startExercise(){
  const c=COURSES[state.currentSubject]; const unit=c.units[state.currentUnitIndex];
  const lesson=unit.lessons[state.currentLessonIndex];
  if(lesson.type==='math-random'){
    state.exercises=generateMathQuestions();
  } else {
    state.exercises=lesson.exercises||[];
  }
  state.currentExIndex=0; state.userAnswers=new Array(state.exercises.length).fill(-1);
  state.answered=false; state.selectedIdx=-1;
  if(state.exercises.length===0){ showToast('本课暂无练习'); return; }
  document.getElementById('exTitle').textContent=lesson.title+' · 练习';
  showPage('page-exercise'); renderExercise();
}

        let status='';
        if(state.answered){
          if(oi===ans) status='correct';
          else if(oi===state.selectedIdx&&oi!==ans) status='wrong';
        } else if(oi===state.selectedIdx) status='selected';
        return `<div class="option-card ${status}" onclick="selectAnswer(${oi})">
          <div class="option-label">${'ABCD'[oi]}</div>
          <div class="option-text">${o}</div>
          ${status==='correct'?'<span class="option-icon">✅</span>':''}
          ${status==='wrong'?'<span class="option-icon">❌</span>':''}
        </div>`;
      }).join('')}`;
  }

  // Status text (only for non-spell)
  const st=document.getElementById('exStatus');
  if(!isSpell){
    if(state.answered){
      const correct=state.selectedIdx===ans;
      st.innerHTML=correct?'<span class="status-correct">✅ 回答正确！</span>':'<span class="status-wrong">❌ 再想想哦</span>';
    } else { st.innerHTML=''; }
  } else { st.innerHTML=''; }

  // Nav buttons
  document.getElementById('exPrev').disabled=(i===0);
  const nextBtn=document.getElementById('exNext');
  nextBtn.disabled=!state.answered;
  nextBtn.textContent=i>=total-1?'完成 ✅':'下一题 ▶';

  // Dots
  document.getElementById('exDots').innerHTML=exs.map((_,di)=>{
    let cls='ex-dot';
    if(di===i) cls+=' current';
    const ua=state.userAnswers[di];
    if(typeof ua==='number'&&ua>=0){
      const isCorrect=(ua===1);
      cls+=isCorrect?' correct':' wrong';
    }
    return `<div class="${cls}"></div>`;
  }).join('');
}

function selectAnswer(idx){
  if(state.answered) return;
  state.selectedIdx=idx;
  const cards=document.querySelectorAll('.option-card');
  cards.forEach((c,i)=>{ c.className='option-card'; if(i===idx) c.classList.add('selected'); });
  setTimeout(()=>{
    const ex=state.exercises[state.currentExIndex]; const ans=ex.ans!==undefined?ex.ans:ex.answer;
    state.userAnswers[state.currentExIndex]=idx;
    state.answered=true;
    vibrate(idx===ans?100:[200,100,200]);
    renderExercise();
  },400);
}

function submitSpelling(){
  if(state.answered) return;
  const input=document.getElementById('spellInput');
  if(!input) return;
  const val=input.value.trim();
  if(!val){ showToast('请输入英文单词'); return; }
  const ex=state.exercises[state.currentExIndex]; const ans=(ex.ans||ex.answer||'').toLowerCase().trim();
  const correct=val.toLowerCase().trim()===ans;
  state.userAnswers[state.currentExIndex]=correct?1:0;
  state.spellCorrect=correct;
  state.answered=true;
  vibrate(correct?100:[200,100,200]);
  renderExercise();
}

function exPrev(){
  if(state.currentExIndex<=0) return;
  state.currentExIndex--; const prevAns=state.userAnswers[state.currentExIndex];
  state.answered=prevAns>=0; state.selectedIdx=(typeof prevAns==='number'&&prevAns>=0)?prevAns:-1;
  state.spellCorrect=(typeof prevAns==='number'&&prevAns===1);
  renderExercise();
}

function exNext(){
  if(!state.answered) return;
  if(state.currentExIndex>=state.exercises.length-1){ finishExercise(); return; }
  state.currentExIndex++; const nextAns=state.userAnswers[state.currentExIndex];
  state.answered=(typeof nextAns==='number'&&nextAns>=0);
  state.selectedIdx=(typeof nextAns==='number'&&nextAns>=0)?nextAns:-1;
  state.spellCorrect=(typeof nextAns==='number'&&nextAns===1);
  renderExercise();
}

function finishExercise(){
  vibrate(300);
  const exs=state.exercises; const answers=state.userAnswers;
  let correct=0; answers.forEach((a,i)=>{
    const ex=exs[i];
    if(ex.type==='spell'){ if(a===1) correct++; }
    else { if(a===ex.ans||a===ex.answer) correct++; }
  });
  const total=exs.length; const accuracy=Math.round((correct/total)*100);
  const stars=calculateStars(correct,total,state.currentSubject);

  // Save progress
  const c=COURSES[state.currentSubject]; const unit=c.units[state.currentUnitIndex];
  const p=getProgress();
  if(!p[state.currentSubject]) p[state.currentSubject]={};
  const existing=p[state.currentSubject][unit.id]||{};
  p[state.currentSubject][unit.id]={
    ...existing, completed:accuracy>=50, stars,bestStars:Math.max(existing.bestStars||0,stars),
    bestScore:Math.max(existing.bestScore||0,accuracy),updatedAt:Date.now()
  };
  if(accuracy>=50&&!existing.completedAt) p[state.currentSubject][unit.id].completedAt=Date.now();
  saveProgress(p);
  if(stars>0) addStars(stars);

  // Badges
  const totalStars=getTotalStars(); const badges=getBadges(); const newBadges=[];
  const milestones=[{id:'stars-10',name:'⭐ 初露锋芒',desc:'累计获得10颗星',cond:totalStars>=10},{id:'stars-30',name:'🌟 学习小达人',desc:'累计获得30颗星',cond:totalStars>=30},{id:'stars-60',name:'💫 智慧之星',desc:'累计获得60颗星',cond:totalStars>=60},{id:'stars-100',name:'👑 学霸大王',desc:'累计获得100颗星',cond:totalStars>=100}];
  milestones.forEach(m=>{ if(m.cond&&!badges.find(b=>b.id===m.id)){ addBadge(m); newBadges.push(m); } });
  if(stars>=5&&!badges.find(b=>b.id==='first-perfect')){ const fb={id:'first-perfect',name:'🎯 满分冠军',desc:'第一次全部答对'}; addBadge(fb); newBadges.push(fb); }

  // Render result
  showPage('page-result');
  let msg='',emoji='';
  if(stars>=5){ msg='太棒了！全对通过！'; emoji='🎉'; }
  else { msg='别灰心，再来一次吧！'; emoji='💪'; }

  const hasNextLesson=state.currentLessonIndex<unit.lessons.length-1;
  const hasNextUnit=state.currentUnitIndex<c.units.length-1;
  const hasNext=hasNextLesson||hasNextUnit;

  document.getElementById('resultContent').innerHTML=`
    <div class="result-card card">
      <span class="result-emoji pop-in">${emoji}</span>
      <span class="result-message">${msg}</span>
      <div class="result-score"><span class="num">${correct}</span><span class="divider">/</span><span class="total">${total}</span>正确</div>
      <div class="result-accuracy">正确率：${accuracy}%</div>
      <div class="result-stars">${stars>=5?'⭐ × '+stars:'☆'}</div>
    </div>
    <div class="result-grade card">
      <div style="font-weight:700;margin-bottom:12px;padding-bottom:8px;border-bottom:2px dashed #EEE">成绩单</div>
      <div class="row"><span>科目</span><span class="val" style="color:${c.color}">${c.name}</span></div>
      <div class="row"><span>单元</span><span class="val">${unit.title}</span></div>
      <div class="row"><span>正确题数</span><span class="val">${correct}/${total}</span></div>
      <div class="row"><span>获得星星</span><span class="val">⭐ × ${stars}</span></div>
      ${newBadges.length?`<div style="margin-top:12px;background:#FFF9E6;border-radius:var(--radius);padding:16px;text-align:center">
        🎊 获得新徽章！${newBadges.map(b=>`<span style="display:inline-block;background:#fff;border-radius:20px;padding:6px 14px;margin:6px;font-weight:600;font-size:var(--font-sm)">${b.name}</span>`).join('')}</div>`:''}
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:16px;padding:0 4px">
      <button class="btn btn-outline" onclick="retryExercise()">🔄 再来一次</button>
      <button class="btn btn-outline" onclick="goLesson()">📖 返回学习</button>
      ${hasNext?`<button class="btn btn-primary" onclick="goNext()">下一关 ▶️</button>`:`<button class="btn btn-accent" onclick="goHome()">🏠 返回首页</button>`}
    </div>`;
}

function retryExercise(){ showPage('page-exercise'); state.currentExIndex=0; state.userAnswers=new Array(state.exercises.length).fill(-1); state.answered=false; state.selectedIdx=-1; renderExercise(); }

function goNext(){
  const c=COURSES[state.currentSubject]; const unit=c.units[state.currentUnitIndex];
  if(state.currentLessonIndex<unit.lessons.length-1){ state.currentLessonIndex++; state.currentCardIndex=0; goLesson(); return; }
  if(state.currentUnitIndex<c.units.length-1){ state.currentUnitIndex++; state.currentLessonIndex=0; state.currentCardIndex=0; goSubject(); return; }
  goHome();
}

/* ================================================================
   REWARD PAGE
   ================================================================ */
function renderReward(){
  const stars=getTotalStars(); const earnedBadges=getBadges(); const progress=getProgress();
  const allBadges=[
    { id:'stars-10',name:'初露锋芒',icon:'⭐',desc:'累计获得10颗星'},{ id:'stars-30',name:'学习小达人',icon:'🌟',desc:'累计获得30颗星'},
    { id:'stars-60',name:'智慧之星',icon:'💫',desc:'累计获得60颗星'},{ id:'stars-100',name:'学霸大王',icon:'👑',desc:'累计获得100颗星'},
    { id:'first-perfect',name:'满分冠军',icon:'🎯',desc:'第一次获得3颗星'},{ id:'chinese-all',name:'语文小学者',icon:'📖',desc:'完成全部语文单元'},
    { id:'math-all',name:'数学小天才',icon:'🔢',desc:'完成全部数学单元'},{ id:'english-all',name:'英语小达人',icon:'🔤',desc:'完成全部英语单元'}
  ];

  // Auto-check subject badges
  ['chinese','math','english'].forEach(k=>{
    const p=progress[k]||{}; const course=COURSES[k];
    const allDone=course.units.every(u=>p[u.id]&&p[u.id].completed);
    if(allDone){ const bid=k+'-all'; if(!earnedBadges.find(b=>b.id===bid)){ const badge=allBadges.find(b=>b.id===bid); if(badge) addBadge(badge); } }
  });
  const freshBadges=getBadges();

  const badgesHtml=allBadges.map(b=>{ const earned=!!freshBadges.find(x=>x.id===b.id);
    return `<div class="badge-card ${earned?'earned':'locked'}"><div class="badge-icon">${earned?b.icon:'🔒'}</div><div class="badge-name">${b.name}</div><div class="badge-desc">${b.desc}</div><div class="badge-status">${earned?'已获得 ✅':'未解锁'}</div></div>`; }).join('');

  // Subject stats
  const subjects=['chinese','math','english'].map(k=>{
    const p=progress[k]||{}; const course=COURSES[k]; const total=course.units.length;
    const done=Object.values(p).filter(u=>u.completed).length; const st=Object.values(p).reduce((s,u)=>s+(u.bestStars||0),0);
    return {key:k,name:course.name,icon:course.icon,color:course.color,total,done,stars:st,pct:Math.round((done/total)*100)};
  });
  const statsHtml=subjects.map(s=>`<div class="stat-card"><div class="flex-between"><div class="flex-center"><span style="font-size:20px;margin-right:8px">${s.icon}</span><span style="font-weight:700">${s.name}</span></div><span style="font-weight:600;color:#F39C12">⭐ ${s.stars}</span></div><div class="stat-bar"><div class="stat-fill" style="width:${s.pct}%;background:${s.color}"></div></div><div style="font-size:var(--font-xs);color:var(--text-light)">完成 ${s.done}/${s.total} 个单元 (${s.pct}%)</div></div>`).join('');

  // Shop
  const shopItems=state.shopItems;
  const pokemonItems=shopItems.filter(s=>s.category==='pokemon').map(s=>`<div class="shop-card2" style="background:${s.bgColor};border-color:${s.color}" onclick="openExchange('${s.id}')"><span class="shop-icon">${s.icon}</span><span class="shop-name">${s.name}</span><span class="shop-desc">${s.desc}</span><div class="shop-bottom"><span class="shop-price" style="background:${s.color}">⭐ ${s.cost}</span><span class="shop-tag">${s.priceTag}</span></div></div>`).join('');
  const gameItems=shopItems.filter(s=>s.category==='game').map(s=>`<div class="shop-card2" style="background:${s.bgColor};border-color:${s.color}" onclick="openExchange('${s.id}')"><span class="shop-icon">${s.icon}</span><span class="shop-name">${s.name}</span><span class="shop-desc">${s.desc}</span><div class="shop-bottom"><span class="shop-price" style="background:${s.color}">⭐ ${s.cost}</span><span class="shop-tag">${s.priceTag}</span></div></div>`).join('');

  const history=getExchangeHistory().slice(-10).reverse();
  const historyHtml=history.length?`<div class="section-title">📋 兑换记录</div>${history.map(h=>`<div class="history-item"><span class="history-icon">${h.icon}</span><span class="history-name">${h.name}</span><span class="history-cost">-${h.cost} ⭐</span></div>`).join('')}`:'';

  let footerMsg;
  if(stars>=500) footerMsg='👑 你已经非常厉害了！继续加油！';
  else if(stars>=300) footerMsg='🎮 可以兑换Switch游戏啦！';
  else if(stars>=100) footerMsg='🎴 可以兑换宝可梦卡包啦！';
  else if(stars>=50) footerMsg='📚 不错的开始！每天进步一点点！';
  else footerMsg='🚀 快来学习获取你的第一颗星星吧！';

  document.getElementById('rewardContent').innerHTML=`
    <div class="reward-hero2"><span class="star-icon">⭐</span><span class="star-count">${stars}</span><span class="star-label">颗星星</span></div>
    <div class="section-title">🎮 星星兑换商城</div>
    <div class="section-subtitle">努力学习攒星星，兑换宝可梦奖励！</div>
    <div class="shop-cat-title"><span>🎴 宝可梦卡包</span><span class="shop-cat-cost">100 ⭐ / 包（≤50元）</span></div>
    <div class="shop-scroll">${pokemonItems}</div>
    <div style="margin-top:20px"></div>
    <div class="shop-cat-title"><span>🎮 Switch 游戏</span><span class="shop-cat-cost">300 ⭐ / 款（≤200元）</span></div>
    <div class="shop-scroll">${gameItems}</div>
    ${historyHtml}
    <div class="section-title">🏅 徽章收藏 (${freshBadges.length}/${allBadges.length})</div>
    <div class="badge-grid">${badgesHtml}</div>
    <div class="section-title">📊 学习统计</div>${statsHtml}
    <div style="text-align:center;padding:24px;font-weight:600">${footerMsg}</div>`;
}

function openExchange(id){
  const item=state.shopItems.find(s=>s.id===id);
  if(!item) return;
  const stars=getTotalStars();
  if(stars<item.cost){ showToast(`星星不足！还需要 ${item.cost-stars} 颗⭐`,2500); return; }
  modalshow(`
    <div class="ex-modal-icon">${item.icon}</div>
    <div style="font-size:var(--font-lg);font-weight:700;margin-bottom:4px">确认兑换？</div>
    <div style="font-size:var(--font-md);color:var(--primary);font-weight:600;margin-bottom:20px">${item.name}</div>
    <div style="display:flex;flex-direction:column;gap:8px;background:#F8F8F8;border-radius:var(--radius);padding:16px;margin-bottom:16px;font-size:var(--font-md)">
      <span>需要消耗：<span style="font-weight:700;color:#E74C3C">⭐ ${item.cost}</span></span>
      <span>当前拥有：<span style="font-weight:700;color:#F39C12">⭐ ${stars}</span></span>
      <span>兑换后剩余：<span style="font-weight:700;color:#2ECC71">⭐ ${stars-item.cost}</span></span>
    </div>
    <div style="font-size:var(--font-xs);color:var(--text-light);margin-bottom:20px">💡 兑换后请找爸爸妈妈要实物奖励哦~</div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="modalhide()">再想想</button>
      <button class="btn btn-primary" onclick="confirmExchange('${item.id}')">确认兑换！</button>
    </div>`);
}

function confirmExchange(id){
  const item=state.shopItems.find(s=>s.id===id);
  if(!item) return;
  const remaining=spendStars(item.cost);
  if(remaining<0){ showToast('星星不足！'); return; }
  addExchangeRecord({id:item.id,name:item.name,icon:item.icon,cost:item.cost,category:item.category,priceTag:item.priceTag});
  vibrate(400); modalhide();
  modalshow(`<div style="font-size:60px;margin-bottom:12px">🎉</div>
    <div style="font-size:var(--font-lg);font-weight:700;margin-bottom:6px">兑换成功！</div>
    <div style="font-size:var(--font-md);margin-bottom:12px">恭喜获得「${item.name}」！</div>
    <div style="color:var(--text-light);margin-bottom:8px">消费 ${item.cost} ⭐ · 剩余 ${remaining} ⭐</div>
    <div style="font-size:var(--font-xs);color:var(--text-light);margin-bottom:16px">请找爸爸妈妈兑换实物哦~</div>
    <button class="btn btn-primary" onclick="modalhide();renderReward();renderHome()">太棒了！</button>`);
}

/* ================================================================
   INIT
   ================================================================ */
// Service worker: only register when served over HTTP (not file://)
if('serviceWorker' in navigator && (location.protocol==='https:' || location.protocol==='http:')){
  const swCode='const C="yxxj-v2";self.addEventListener("install",e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(["./"])));self.skipWaiting()});self.addEventListener("activate",e=>{e.waitUntil(caches.keys().then(k=>Promise.all(k.filter(x=>x!==C).map(x=>caches.delete(x)))));self.clients.claim()});self.addEventListener("fetch",e=>{e.respondWith(caches.match(e.request).then(c=>c||fetch(e.request)))})';
  const blob=new Blob([swCode],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

// URL参数：?stars=1000 可以快速设置星星数（方便测试兑换）
(function(){
  const m=location.search.match(/[?&]stars=(\d+)/);
  if(m){ const n=parseInt(m[1]); LS.set('stars',n); showToast(`已设置 ${n} ⭐`); }
})();

renderHome();

// Prevent double-tap zoom on buttons
document.addEventListener('dblclick',function(e){ if(e.target.tagName==='BUTTON') e.preventDefault(); },{passive:false});
</script>
</body>
